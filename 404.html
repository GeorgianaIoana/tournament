<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;">
    <title>Pagină Negăsită | THE SQUARE 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="images/chess-queen.svg">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f5f6fb 0%, #e8eaf5 50%, #d4daf0 100%);
            padding: 2rem;
            text-align: center;
        }

        .error-content {
            max-width: 600px;
        }

        .error-icon {
            font-size: 8rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 400;
            color: #203d36;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(
                120deg,
                #203d36 0%,
                #2d8b7a 50%,
                #6b5b95 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 400;
            color: #203d36;
            margin-bottom: 1rem;
        }

        .error-title em {
            font-style: italic;
            background: linear-gradient(
                120deg,
                #6b5b95 0%,
                #d4a5ff 50%,
                #ff9de2 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            font-family: var(--font-body);
            font-size: 1rem;
            color: #6b7a8a;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .error-btn--primary {
            background: linear-gradient(135deg, #203d36 0%, #2d8b7a 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(32, 61, 54, 0.3);
        }

        .error-btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(32, 61, 54, 0.4);
        }

        .error-btn--secondary {
            background: rgba(255, 255, 255, 0.8);
            color: #203d36;
            border: 1px solid rgba(32, 61, 54, 0.2);
        }

        .error-btn--secondary:hover {
            background: #fff;
            border-color: rgba(32, 61, 54, 0.3);
        }

        .error-btn svg {
            width: 18px;
            height: 18px;
        }

        .error-chess {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            opacity: 0.3;
        }

        .error-chess span {
            font-size: 2rem;
        }

        .error-links {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .error-links a {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: #6b7a8a;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .error-links a:hover {
            color: #2d8b7a;
        }
    </style>
</head>
<body>
    <section class="error-page">
        <div class="error-content">
            <a href="index.html" class="error-logo">
                <img src="images/logo-footer.webp" alt="THE SQUARE" style="height: 60px; margin-bottom: 2rem;">
            </a>
            <div class="error-code">404</div>
            <h1 class="error-title">Pagină <em>Negăsită</em></h1>
            <p class="error-message">
                Se pare că această pagină a fost mutată sau nu există.
                Ca într-o partidă de șah, uneori trebuie să ne regândim strategia.
            </p>

            <div class="error-actions">
                <a href="index.html" class="error-btn error-btn--primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9,22 9,12 15,12 15,22"/>
                    </svg>
                    Pagina Principală
                </a>
                <a href="contact.html" class="error-btn error-btn--secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    Contactează-ne
                </a>
            </div>

            <div class="error-chess">
                <span>♜</span>
                <span>♞</span>
                <span>♝</span>
                <span>♛</span>
                <span>♚</span>
                <span>♝</span>
                <span>♞</span>
                <span>♜</span>
            </div>

            <div class="error-links">
                <a href="index.html#events">Categorii</a>
                <a href="schedule.html">Program</a>
                <a href="rules.html">Regulament</a>
                <a href="index.html#register">Înscrie-te</a>
            </div>
        </div>
    </section>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/40765815641" target="_blank" rel="noopener noreferrer" class="whatsapp-float" aria-label="Contact WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
    </a>
</body>
</html>
